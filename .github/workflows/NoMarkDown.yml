name: Clean Markdown in Issue Body

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, edited]
#   discussion:
#     types: [created, edited]
#   discussion_comment:
#     types: [created, deleted]

permissions:
  issues: write

jobs:
    clean-body:
      runs-on: ubuntu-latest
      steps:
        - name: Clean and Update Issue Body
          uses: actions/github-script@v9
          with:
            script: |
                function work(originalText, isInCell) {
                    originalText = originalText ?? "";
                    if (originalText.trim().length == 0) {
                        return {
                            text: originalText,
                            hasChange: false
                        }
                    }

                    const lines = originalText.split('\n');

                    let isInCodeBlock = false;
                    let hasChange = false;
                    const processedLines = lines.map(originalLine => {
                        const trimmed = originalLine.trim();

                        if (!isInCell) {
                            if (/^\s*```/g.test(originalLine)) {
                                isInCodeBlock = !isInCodeBlock;
                            }

                            if (isInCodeBlock) {
                                return originalLine;
                            }
                        }

                        let cleanLine = originalLine;

                        if (trimmed.startsWith("|") && trimmed.endsWith("|") && trimmed.length >= 2) {
                            // セルの中身を個別に処理
                            const cells = trimmed.split("|").map(cell => work(cell, true))
                            if (cells.some(c => c.hasChange)) {
                                cleanLine = cells.map(_ => _.text).join("|");
                                hasChange = true;
                            }
                        }
                        else {
                            // インラインコードの削除 `code` -> code
                            cleanLine = cleanLine.replace(/`([^`]+)`/g, '$1')

                            // 太字・イタリックの削除 (**text**, *text*, __text__, _text_)
                            cleanLine = cleanLine.replace(/(\*{1,3}|_{1,3})(.*?)\1/g, '$2')

                            //リンクを行全体に拡張
                            let url = "";
                            cleanLine = cleanLine.replace(/\[([^\]]+)\]\((.*)\)/g, (match, linkText, u) => {
                                if (u != "") {
                                    url = u;
                                }
                                return `${linkText}`;
                            });
                            if (url != "") {
                                const markdownRegex = /^(\s*(?:#{1,6}|>+|\*|\-|\+|\d+\.|- [[ xX]])\s+)(.*)$/;
                                const match = cleanLine.match(markdownRegex);
                                if (match) {
                                    cleanLine = `${match[1]}[${match[2]}](${url})`;
                                }
                                else {
                                    cleanLine = `[${cleanLine}](${url})`;
                                }
                            }

                            hasChange |= (cleanLine != originalLine);
                        }

                        return cleanLine;
                    });

                    return {
                        text: (hasChange ? processedLines.join('\n') : originalText),
                        hasChange: hasChange
                    }
                }

                async function replaceIssueBody() {
                    const result = work(context.payload.issue.body, false);
                    if (result.hasChange) {
                        // Issueを書き換える
                        await github.rest.issues.update({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            issue_number: context.payload.issue.number,
                            body: result.text
                        });
                    }
                }
                
                async function replacePullrequestBody() {
                    const result = work(context.payload.pull_request.body, false);
                    if (result.hasChange) {
                        // Pullrequestを書き換える
                        await github.rest.pulls.update({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            issue_number: context.payload.pull_request.number,
                            body: result.text
                        });
                    }
                }

                async function replaceIssueCommentBody() {
                    const result = work(context.payload.comment.body, false);
                    if (result.hasChange) {
                        // IssueまたはPullrequestのコメントを書き換え
                        await github.rest.issues.updateComment({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            comment_id: context.payload.comment.id,
                            body: result.text
                        });
                    }
                }

                const eventName = context.eventName;
                console.log(`Triggered by event: ${eventName}`);
                console.log(`payload: ${JSON.stringify(context, null, 2)}`);
                console.log(`######1`);

                if (eventName == 'issues') {
                    await replaceIssueBody()
                }
                else if (eventName == 'pull_request') {
                    //await replacePullrequestBody()
                }
                else if (eventName == 'issue_comment') {
                    await replaceIssueCommentBody();
                }

           